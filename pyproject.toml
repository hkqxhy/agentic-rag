[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-rag"
version = "0.2.0"
description = "Evidence-grounded new-student assistant for Nanjing University"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
authors = [{ name = "Agentic RAG contributors" }]
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "email-validator>=2.2,<3",
  "fastapi>=0.116,<1",
  "langgraph>=1.2,<2",
  "httpx>=0.28,<1",
  "opentelemetry-api>=1.37,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.37,<2",
  "opentelemetry-instrumentation-fastapi>=0.58b0,<1",
  "opentelemetry-sdk>=1.37,<2",
  "pgvector>=0.4,<1",
  "pydantic-settings>=2.10,<3",
  "pwdlib[argon2]>=0.3,<1",
  "redis>=8,<9",
  "sqlalchemy[asyncio]>=2.0.51,<2.2",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8,<9",
  "pytest-asyncio>=1,<2",
  "pytest-cov>=6,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
agentic-rag-api = "agentic_rag.api.app:run"
agentic-rag-worker = "agentic_rag.worker:run"
agentic-rag-v1 = "agentic_rag_v1.cli:main"
agentic-rag-v1-server = "agentic_rag_v1.api:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agentic_rag*", "agentic_rag_v1*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["src/agentic_rag_v1"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = "^src/agentic_rag_v1/"
