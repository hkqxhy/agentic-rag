name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Reject local-only tracked files
        shell: bash
        run: |
          forbidden="$(git ls-files \
            | grep -E '(^|/)\.env($|\.)|\.log$|(^|/)\.agentic_rag_v1_index/|(^|/)Documents/|(^|/)QQ/|(^|/)reports/' \
            | grep -v -E '(^|/)\.env\.example$' \
            || true)"
          if [ -n "$forbidden" ]; then
            printf 'Forbidden tracked files:\n%s\n' "$forbidden"
            exit 1
          fi

      - name: Reject retired project name
        shell: bash
        run: |
          retired_pattern="$(printf '%s%s' 'pai' 'mon')"
          path_hits="$(git ls-files | grep -i "$retired_pattern" || true)"
          content_hits="$(git grep -Iin -e "$retired_pattern" -- . || true)"
          if [ -n "$path_hits$content_hits" ]; then
            printf 'Retired name found in tracked files:\n%s\n%s\n' "$path_hits" "$content_hits"
            exit 1
          fi

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and test tools
        run: python -m pip install -e '.[dev]'

      - name: Lint backend
        run: ruff check src/agentic_rag tests/unit tests/integration

      - name: Compile Python sources
        run: python -m compileall -q src tests agentic_rag_v1_server.py

      - name: Type-check backend
        run: mypy src/agentic_rag tests/unit tests/integration tests/e2e

      - name: Run unit and V1 regression tests
        run: pytest -q tests/unit tests/test_agentic_rag_v1.py

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: agentic_rag
          POSTGRES_USER: agentic_rag
          POSTGRES_PASSWORD: agentic_rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentic_rag -d agentic_rag"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      AGENTIC_RAG_DATABASE_URL: postgresql+asyncpg://agentic_rag:agentic_rag@localhost:5432/agentic_rag
      AGENTIC_RAG_REDIS_URL: redis://localhost:6379/0
      AGENTIC_RAG_RUN_INTEGRATION: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and test tools
        run: python -m pip install -e '.[dev]'

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Test PostgreSQL, Redis, worker and SSE event chain
        run: pytest -q tests/integration

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        run: pnpm --dir apps/web lint

      - name: Type-check frontend
        run: pnpm --dir apps/web typecheck

      - name: Build frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        run: pnpm --dir apps/web build

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Compose model
        run: docker compose -f deploy/compose/docker-compose.yml config --quiet

      - name: Validate ECS scripts
        run: bash -n deploy/ecs/*.sh

      - name: Validate staging Compose model
        run: >-
          docker compose
          --env-file deploy/env/staging.env.example
          -f deploy/compose/docker-compose.yml
          -f deploy/compose/docker-compose.staging.yml
          config --quiet

      - name: Validate staging base image references
        shell: bash
        run: |
          while IFS='=' read -r name image; do
            case "$name" in
              POSTGRES_IMAGE|REDIS_IMAGE|CADDY_IMAGE|PYTHON_BASE_IMAGE|NODE_BASE_IMAGE)
                for attempt in 1 2 3 4; do
                  if docker buildx imagetools inspect "$image" >/dev/null; then
                    break
                  fi
                  if [ "$attempt" -eq 4 ]; then
                    echo "Unable to inspect $image after $attempt attempts" >&2
                    exit 1
                  fi
                  sleep $((attempt * 5))
                done
                ;;
            esac
          done < deploy/env/staging.env.example

      - name: Validate production Compose model
        run: >-
          docker compose
          --env-file deploy/env/production.env.example
          -f deploy/compose/docker-compose.yml
          -f deploy/compose/docker-compose.prod.yml
          config --quiet

      - name: Validate k6 load-test contract
        run: >-
          docker run --rm
          -v "$PWD/load/k6:/scripts:ro"
          grafana/k6:2.0.0
          inspect /scripts/phase1-smoke.js

      - name: Validate Phase 2 model-load contract
        run: >-
          docker run --rm
          -v "$PWD/load/k6:/scripts:ro"
          grafana/k6:2.0.0
          inspect /scripts/phase2-model.js

      - name: Validate Phase 2 platform-load contract
        run: >-
          docker run --rm
          -v "$PWD/load/k6:/scripts:ro"
          grafana/k6:2.0.0
          inspect /scripts/phase2-platform.js
