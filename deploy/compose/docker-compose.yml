name: agentic-rag

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_DB: agentic_rag
      POSTGRES_USER: agentic_rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentic_rag}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentic_rag -d agentic_rag"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE:-redis:8-alpine}
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis_data:/data
    restart: unless-stopped

  migrate:
    build:
      context: ../..
      dockerfile: deploy/docker/api.Dockerfile
      args: &api-build-args
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.12-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    command: ["alembic", "upgrade", "head"]
    environment: &backend-environment
      AGENTIC_RAG_ENVIRONMENT: development
      AGENTIC_RAG_DATABASE_URL: postgresql+asyncpg://agentic_rag:${POSTGRES_PASSWORD:-agentic_rag}@postgres:5432/agentic_rag
      AGENTIC_RAG_REDIS_URL: redis://redis:6379/0
      AGENTIC_RAG_CORS_ORIGINS: http://localhost:3000
      AGENTIC_RAG_SESSION_COOKIE_SECURE: "false"
      AGENTIC_RAG_AUDIT_HASH_KEY: ${AGENTIC_RAG_AUDIT_HASH_KEY:-development-only-change-me}
      AGENTIC_RAG_TRUST_PROXY_HEADERS: "false"
      AGENTIC_RAG_SOURCE_PATHS: ${AGENTIC_RAG_SOURCE_PATHS:-knowledge/fixtures}
      AGENTIC_RAG_INDEX_DIR: ${AGENTIC_RAG_INDEX_DIR:-/app/runtime/index}
      AGENTIC_RAG_TOP_K: ${AGENTIC_RAG_TOP_K:-5}
      AGENTIC_RAG_CANDIDATE_K: ${AGENTIC_RAG_CANDIDATE_K:-40}
      AGENTIC_RAG_MIN_CONFIDENCE: ${AGENTIC_RAG_MIN_CONFIDENCE:-0.16}
      AGENTIC_RAG_USE_CACHE: ${AGENTIC_RAG_USE_CACHE:-1}
      AGENTIC_RAG_USE_GRAPHRAG: ${AGENTIC_RAG_USE_GRAPHRAG:-1}
      AGENTIC_RAG_LLM_BASE_URL: ${AGENTIC_RAG_LLM_BASE_URL:-}
      AGENTIC_RAG_LLM_MODEL: ${AGENTIC_RAG_LLM_MODEL:-qwen-plus}
      AGENTIC_RAG_LLM_API_KEY: ${AGENTIC_RAG_LLM_API_KEY:-EMPTY}
      AGENTIC_RAG_LLM_TIMEOUT: ${AGENTIC_RAG_LLM_TIMEOUT:-30}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api:
    build:
      context: ../..
      dockerfile: deploy/docker/api.Dockerfile
      args: *api-build-args
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    stop_grace_period: 30s

  worker:
    build:
      context: ../..
      dockerfile: deploy/docker/api.Dockerfile
      args: *api-build-args
    command: ["python", "-m", "agentic_rag.worker"]
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "agentic_rag.healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
      args:
        NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-node:22-alpine}
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
