name: agentic-rag

services:
  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:0.8.6-pg17-bookworm}

  redis:
    image: ${REDIS_IMAGE:-public.ecr.aws/docker/library/redis:8-alpine}

  migrate:
    build:
      args: &staging-api-build-args
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-public.ecr.aws/docker/library/python:3.12-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    environment: &staging-backend-environment
      AGENTIC_RAG_ENVIRONMENT: staging
      AGENTIC_RAG_DATABASE_URL: postgresql+asyncpg://agentic_rag:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/agentic_rag
      AGENTIC_RAG_REDIS_URL: redis://redis:6379/0
      AGENTIC_RAG_CORS_ORIGINS: ${STAGING_ORIGIN:?set STAGING_ORIGIN}
      AGENTIC_RAG_SESSION_COOKIE_SECURE: "false"
      AGENTIC_RAG_AUDIT_HASH_KEY: ${AGENTIC_RAG_AUDIT_HASH_KEY:?set AGENTIC_RAG_AUDIT_HASH_KEY}
      AGENTIC_RAG_TRUST_PROXY_HEADERS: "true"
      AGENTIC_RAG_QUESTION_RATE_LIMIT: ${QUESTION_RATE_LIMIT:-10}
      AGENTIC_RAG_QUESTION_RATE_WINDOW_SECONDS: ${QUESTION_RATE_WINDOW_SECONDS:-60}
      AGENTIC_RAG_IP_QUESTION_RATE_LIMIT: ${IP_QUESTION_RATE_LIMIT:-120}
      AGENTIC_RAG_AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-60}
      AGENTIC_RAG_AUTH_IDENTITY_RATE_LIMIT: ${AUTH_IDENTITY_RATE_LIMIT:-10}
      AGENTIC_RAG_AUTH_RATE_WINDOW_SECONDS: ${AUTH_RATE_WINDOW_SECONDS:-300}
      AGENTIC_RAG_SOURCE_PATHS: ${AGENTIC_RAG_SOURCE_PATHS:-knowledge/fixtures}
      AGENTIC_RAG_INDEX_DIR: ${AGENTIC_RAG_INDEX_DIR:-/app/runtime/index}
      AGENTIC_RAG_TOP_K: ${AGENTIC_RAG_TOP_K:-5}
      AGENTIC_RAG_CANDIDATE_K: ${AGENTIC_RAG_CANDIDATE_K:-40}
      AGENTIC_RAG_MIN_CONFIDENCE: ${AGENTIC_RAG_MIN_CONFIDENCE:-0.16}
      AGENTIC_RAG_USE_CACHE: ${AGENTIC_RAG_USE_CACHE:-1}
      AGENTIC_RAG_USE_GRAPHRAG: ${AGENTIC_RAG_USE_GRAPHRAG:-1}
      AGENTIC_RAG_LLM_BASE_URL: ${AGENTIC_RAG_LLM_BASE_URL:-}
      AGENTIC_RAG_LLM_MODEL: ${AGENTIC_RAG_LLM_MODEL:-qwen-plus}
      AGENTIC_RAG_LLM_API_KEY: ${AGENTIC_RAG_LLM_API_KEY:-EMPTY}
      AGENTIC_RAG_LLM_TIMEOUT: ${AGENTIC_RAG_LLM_TIMEOUT:-30}
      AGENTIC_RAG_DENSE_RETRIEVAL_MODE: ${AGENTIC_RAG_DENSE_RETRIEVAL_MODE:-off}
      AGENTIC_RAG_EMBEDDING_BASE_URL: ${AGENTIC_RAG_EMBEDDING_BASE_URL:-}
      AGENTIC_RAG_EMBEDDING_API_KEY: ${AGENTIC_RAG_EMBEDDING_API_KEY:-EMPTY}
      AGENTIC_RAG_EMBEDDING_MODEL: ${AGENTIC_RAG_EMBEDDING_MODEL:-text-embedding-v4}
      AGENTIC_RAG_EMBEDDING_DIMENSIONS: ${AGENTIC_RAG_EMBEDDING_DIMENSIONS:-1024}
      AGENTIC_RAG_EMBEDDING_VERSION: ${AGENTIC_RAG_EMBEDDING_VERSION:-text-embedding-v4-1024-v1}
      AGENTIC_RAG_EMBEDDING_TIMEOUT_SECONDS: ${AGENTIC_RAG_EMBEDDING_TIMEOUT_SECONDS:-15}
      AGENTIC_RAG_DENSE_CANDIDATE_K: ${AGENTIC_RAG_DENSE_CANDIDATE_K:-40}
      AGENTIC_RAG_DENSE_MIN_SIMILARITY: ${AGENTIC_RAG_DENSE_MIN_SIMILARITY:-0.45}
      AGENTIC_RAG_DENSE_RRF_WEIGHT: ${AGENTIC_RAG_DENSE_RRF_WEIGHT:-1.0}

  api:
    build:
      args: *staging-api-build-args
    environment: *staging-backend-environment

  worker:
    build:
      args: *staging-api-build-args
    environment: *staging-backend-environment

  web:
    build:
      args:
        NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-public.ecr.aws/docker/library/node:22-alpine}
        NEXT_PUBLIC_API_BASE_URL: ""

  caddy:
    image: ${CADDY_IMAGE:-public.ecr.aws/docker/library/caddy:2.10-alpine}
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    ports:
      - "80:80"
    volumes:
      - ../caddy/Caddyfile.staging:/etc/caddy/Caddyfile:ro
    restart: unless-stopped
