name: agentic-rag

services:
  migrate:
    environment: &production-backend-environment
      AGENTIC_RAG_ENVIRONMENT: production
      AGENTIC_RAG_DATABASE_URL: postgresql+asyncpg://agentic_rag:${POSTGRES_PASSWORD}@postgres:5432/agentic_rag
      AGENTIC_RAG_REDIS_URL: redis://redis:6379/0
      AGENTIC_RAG_CORS_ORIGINS: https://${SITE_ADDRESS}
      AGENTIC_RAG_SESSION_COOKIE_SECURE: "true"
      AGENTIC_RAG_AUDIT_HASH_KEY: ${AGENTIC_RAG_AUDIT_HASH_KEY}
      AGENTIC_RAG_TRUST_PROXY_HEADERS: "true"
      AGENTIC_RAG_QUESTION_RATE_LIMIT: ${QUESTION_RATE_LIMIT:-10}
      AGENTIC_RAG_QUESTION_RATE_WINDOW_SECONDS: ${QUESTION_RATE_WINDOW_SECONDS:-60}
      AGENTIC_RAG_IP_QUESTION_RATE_LIMIT: ${IP_QUESTION_RATE_LIMIT:-120}
      AGENTIC_RAG_AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-60}
      AGENTIC_RAG_AUTH_IDENTITY_RATE_LIMIT: ${AUTH_IDENTITY_RATE_LIMIT:-10}
      AGENTIC_RAG_AUTH_RATE_WINDOW_SECONDS: ${AUTH_RATE_WINDOW_SECONDS:-300}
      AGENTIC_RAG_SOURCE_PATHS: ${AGENTIC_RAG_SOURCE_PATHS:-knowledge/fixtures}
      AGENTIC_RAG_INDEX_DIR: ${AGENTIC_RAG_INDEX_DIR:-/app/runtime/index}
      AGENTIC_RAG_TOP_K: ${AGENTIC_RAG_TOP_K:-5}
      AGENTIC_RAG_CANDIDATE_K: ${AGENTIC_RAG_CANDIDATE_K:-40}
      AGENTIC_RAG_MIN_CONFIDENCE: ${AGENTIC_RAG_MIN_CONFIDENCE:-0.16}
      AGENTIC_RAG_USE_CACHE: ${AGENTIC_RAG_USE_CACHE:-1}
      AGENTIC_RAG_USE_GRAPHRAG: ${AGENTIC_RAG_USE_GRAPHRAG:-1}
      AGENTIC_RAG_LLM_BASE_URL: ${AGENTIC_RAG_LLM_BASE_URL:-}
      AGENTIC_RAG_LLM_MODEL: ${AGENTIC_RAG_LLM_MODEL:-qwen-plus}
      AGENTIC_RAG_LLM_API_KEY: ${AGENTIC_RAG_LLM_API_KEY:-EMPTY}
      AGENTIC_RAG_LLM_TIMEOUT: ${AGENTIC_RAG_LLM_TIMEOUT:-30}

  api:
    environment: *production-backend-environment

  worker:
    environment: *production-backend-environment

  web:
    build:
      args:
        NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-node:22-alpine}
        NEXT_PUBLIC_API_BASE_URL: ""

  caddy:
    image: ${CADDY_IMAGE:-caddy:2.10-alpine}
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
